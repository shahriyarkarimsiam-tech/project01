name = "telegram-task-lab-mvp"
main = "src/worker.mjs"
compatibility_date = "2026-11-09"
workers_dev = true

[vars]
ENVIRONMENT = "production"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# AFTER creating D1 via `npx wrangler d1 create telegram-task-lab-db`,
# uncomment and replace the id below with the real database UUID.
# [[d1_databases]]
# binding = "DB"
# database_name = "telegram-task-lab-db"
# database_id = "REPLACE_WITH_REAL_DATABASE_ID"
